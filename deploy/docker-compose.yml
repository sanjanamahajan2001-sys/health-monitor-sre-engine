version: '3.8'

services:
  health-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: health-monitor:latest
    container_name: health-monitor
    restart: unless-stopped
    
    # Non-root user
    user: "1000:1000"
    
    # Environment
    environment:
      - HEALTH_MONITOR_DATA_DIR=/data
      - HEALTH_MONITOR_LOG_LEVEL=info
      - HEALTH_MONITOR_LOG_FORMAT=json
    
    # Volumes
    volumes:
      # Configuration
      - ./config/health-monitor.json:/etc/health-monitor/health-monitor.json:ro
      # Data directory
      - health-monitor-data:/var/lib/health-monitor
      # Logs
      - health-monitor-logs:/var/log/health-monitor
    
    # Ports (for healthz and metrics endpoints)
    ports:
      - "8080:8080"  # HTTP API
      - "9090:9090"  # Metrics endpoint
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # Security
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

volumes:
  # Named volumes for persistence
  health-monitor-data:
    driver: local
  health-monitor-logs:
    driver: local

networks:
  default:
    driver: bridge
