profile: core-platform
region: us-central
environment: production

# Core configuration
config:
  prometheus_url: http://platform.monitor.local:9092
  prometheus_token: ""
  prometheus_user: ""
  prometheus_pass: ""
  prometheus_service_label: service
  disable_updates: false
  loki_url: http://platform.monitor.local:3100
  loki_token: ""
  loki_user: ""
  loki_pass: ""
  loki_service_label: service
  loki_route_label: route
  loki_error_regex: ERROR|Exception|timeout|5[0-9][0-9]
  loki_window: 5m
  loki_query_limit: 200
  loki_query_timeout: 30s
  grafana_url: http://platform.monitor.local:3001
  grafana_prom_ds: Prometheus
  grafana_loki_ds: Loki
  grafana_trace_ds: Tempo
  grafana_org_id: 0
  grafana_token: ""
  grafana_user: ""
  grafana_pass: ""
  trace_backend: tempo
  trace_url: http://platform.monitor.local:3200
  trace_token: ""
  trace_user: ""
  trace_pass: ""
  trace_service_map: billing_api=billing_api,identity_service=identity_service,payments_service=payments_service
  trace_service_tag: service
  trace_default_service: billing_api
  trace_window: 5m
  trace_min_duration_ms: 10
  trace_exclude_system_routes: true
  trace_time_unit: ms
  correlation_best_effort: true
  correlation_min_samples: 20
  correlation_max_logs: 200
  correlation_max_results: 5
  correlation_window: 5m
  log_backend: loki
  elastic_url: ""
  elastic_index: ""
  elastic_token: ""
  elastic_user: ""
  elastic_pass: ""
  elastic_service_field: service.name
  elastic_route_field: http.route
  elastic_error_field: error
  elastic_time_field: '@timestamp'
  elastic_error_regex: ERROR|error|Exception|exception
  kibana_url: ""
  kibana_index: ""
  api_service: billing_api
  api_route: /checkout
  service_label: service
  route_label: route
  latency_metric: http_request_duration_seconds
  request_count_metric: http_requests_total
  error_label: status
  error_regex: 5..
  auto_discover: true
  latency_threshold_seconds: 1
  top_endpoints: 5
  window: 5m
  extra_label_selectors: ""
  route_cardinality_limit: 100
  service_cardinality_limit: 150
  apm_dependency_metric: dependency_request_latency_seconds
  apm_source_label: source_service
  apm_dest_label: destination_service
  apm_route_label: route
  apm_window: 10m
  apm_top_edges: 10
  apm_cardinality_limit: 100
  apm_min_rps: 0.1
  runbooks:
    billing_api: https://platform-wiki/runbooks/billing
    identity_service: https://platform-wiki/runbooks/auth
    payments_service: https://platform-wiki/runbooks/payments
  export_path: ""
  data_dir: /var/lib/health-monitor/core-platform
  prometheus_qps: 10
  loki_qps: 3
  observability_lookback_minutes: 5

# Service configuration
services:
  billing_api:
    enabled: true
    port: 8081
    health_check: /health
    dependencies:
      - postgres
      - payments_service
  payments_service:
    enabled: true
    port: 8082
    health_check: /health
    dependencies:
      - stripe_api
      - redis
  identity_service:
    enabled: true
    port: 8083
    health_check: /health
    dependencies:
      - jwt_service
      - redis

# Notification configuration
notifications:
  enabled: true
  notifyon: ["start", "suggest", "ack", "resolve"]
  slack:
    enabled: true
    webhookurl: "https://hooks.slack.com/services/T_MOCK_DEV/B_MOCK_DEV/MOCK_WEBHOOK_KEY_SAFE"
    timeoutseconds: 30
    maxretries: 3
  pagerduty:
    enabled: true
    routingkey: 3af0b4b23b474606c099bc50ad5f463e
    severitymap: {}
    timeoutseconds: 30
    maxretries: 3
  slackwebhookurl: ""
  timeoutseconds: 30
  maxretries: 3

# Runbook Suggestions Configuration
runbook_suggestions:
  enabled: true
  auto_generate: false
  confidence_threshold: 0.5
  template_directory: "/etc/health-monitor/runbook-templates"
  output_directory: "/var/lib/health-monitor/runbooks/core-platform"
  output_format: "markdown"
  publish_to_wiki: false
  wiki_url: ""
  notification_webhook: ""
  retention_days: 365
  max_runbooks_per_pattern: 10
  enabled_categories:
    - capacity
    - latency
    - dependency
    - infra
    - security
  disabled_services: []
  max_suggestions: 3
  cache_ttl: 3600  # 1 hour cache
  custom_patterns:
    - name: "billing_service_error"
      pattern: "billing service unavailable"
      runbook: "rb-billing-service-recovery"
      confidence: 0.9
      description: "Custom pattern for billing service failures"
    - name: "payment_gateway_timeout"
      pattern: "payment gateway timeout"
      runbook: "rb-payment-gateway-timeout"
      confidence: 0.85
      description: "Payment gateway timeout handling"
  metrics_enabled: true
  feedback_enabled: false
  ml_model_enabled: false

# Static runbook URLs (existing functionality)
runbook_urls:
  billing_api: https://wiki.company.com/runbooks/billing-api
  payments_service: https://wiki.company.com/runbooks/payments-service
  identity_service: https://wiki.company.com/runbooks/identity-service

# Alert rules
alerts:
  - match:
      service: billing_api
    severity: P1
    mode: auto
    title: "Checkout Service Degradation"
  - match:
      service: identity_service
    severity: P1
    mode: auto
    title: "Authentication Failure Spike"
  - match:
      service: payments_service
    severity: P2
    mode: auto
    title: "Payment Processing Errors"

# Flows Configuration
flows:
  checkout:
    name: Checkout Flow
    services: [billing_api, payments_service]
    slos:
      - id: checkout_success
        objective: 95
        window: 5m
        type: ratio
        error_query: http_requests_total{service="billing_api",status!="OK"}
        total_query: http_requests_total{service="billing_api"}
      - id: payment_success
        objective: 95
        window: 5m
        type: ratio
        error_query: http_requests_total{service="payments_service",status!="OK"}
        total_query: http_requests_total{service="payments_service"}
  authentication:
    name: Authentication Flow
    services: [identity_service]
    slos:
      - id: auth_success
        objective: 99
        window: 5m
        type: ratio
        error_query: http_requests_total{service="identity_service",status!="OK"}
        total_query: http_requests_total{service="identity_service"}
